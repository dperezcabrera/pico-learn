name: course-qa

on:
  push:
    branches: [main]
  pull_request:

jobs:
  labs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned wheels the lessons run against
        run: |
          python - <<'EOF'
          import json, subprocess, sys
          pins = json.load(open("public/pins.json"))
          pkgs = [f"{name}=={version}" for name, version in pins.items()]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *pkgs, "pytest", "pytest-asyncio", "httpx"])
          EOF
      - run: python scripts/course-qa.py
